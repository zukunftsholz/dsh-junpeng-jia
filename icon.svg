<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Compatibility and Update Watch">
  <title>Compatibility and Update Watch</title>
  <defs>
    <linearGradient id="jj-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6df0"/>
      <stop offset="1" stop-color="#2347b8"/>
    </linearGradient>
  </defs>
  <!-- shield: compatibility check -->
  <path d="M32 5 54 13v16c0 13.2-8.8 23.5-22 30C18.8 52.5 10 42.2 10 29V13L32 5Z"
        fill="url(#jj-shield)" stroke="#17307e" stroke-width="2" stroke-linejoin="round"/>
  <!-- check mark -->
  <path d="m21 31 7.5 7.5L43 22" fill="none" stroke="#ffffff" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- speech bubble: the update request -->
  <g transform="translate(33 33)">
    <rect x="0" y="0" width="24" height="16" rx="5" fill="#ffd166" stroke="#b8860b" stroke-width="2"/>
    <path d="M6 16 4 22l8-6" fill="#ffd166" stroke="#b8860b" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="7" cy="8" r="1.8" fill="#7a5200"/>
    <circle cx="12" cy="8" r="1.8" fill="#7a5200"/>
    <circle cx="17" cy="8" r="1.8" fill="#7a5200"/>
  </g>
</svg>
